<!DOCTYPE html>

<html lang="pt-BR">
<head>

<title>og:image · Questionário do site · Zyphy</title>
<link rel="stylesheet" href="../questionario/css/tokens.css">
<style>
  html,body{margin:0}

  .og-mark{width:72px;height:72px;display:block}
  .og-h1{margin:0;font-family:var(--font-display);font-weight:var(--weight-display);font-size:80px;line-height:var(--lh-h1);text-transform:var(--case-display);letter-spacing:var(--tracking-display)}

</head>
<body>
  <div class="og">
    <img class="og-mark" src="../questionario/assets/favicon.svg" alt="" width="72" height="72">

  </div>
